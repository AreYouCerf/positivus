<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positivus</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="landing">

        <div class="navigation">

            <div class="main_logo">

                <div class="icon">
                    <img src="svg/Icon.svg" alt="icon">
                </div>

                <div class="logo">
                    <img src="svg/Positivus.svg" alt="positivus">
                </div>

            </div>

            <div class="navigation_bar">
                <div class="about"><a href="">About us</a></div>
                <div class="service"><a href="">Services</a></div>
                <div class="case"><a href="">Use Cases</a></div>
                <div class="price"><a href="">Pricing</a></div>
                <div class="blog"><a href="">Blog</a></div>
                <div class="request">
                    <button type="button" class="btn_quote">Request a quote</button>
                </div>
            </div>

        </div>

        <div class="header">

            <div class="mission">
                <div class="head">
                    Navigating the digital landscape for success
                </div>
                <div class="middle">Our digital marketing agency helps businesses grow and succeed online
                    through a range of services including SEO, PPC, social media marketing, and content creation.
                </div>
                <div class="book">
                    <button type="button" class="book_consult">Book a consultation</button>
                </div>
            </div>

            <div class="illustration">

            </div>

        </div>

        <div class="logotypes">

            <div class="first">
                <img src="svg/amazon.svg" class="one">
                <img src="svg/amazoon.svg" class="one_one">
            </div>

            <div class="second">
                <img src="svg/dribble.svg" class="two">
            </div>

            <div class="third">
                <img src="svg/hubspot.svg" class="three">
                <img src="svg/hubspoot.svg" class="three_three">
            </div>

            <div class="fourth">
                <img src="svg/notion.svg" class="four">
            </div>

            <div class="fifth">
                <img src="svg/netflix.svg" class="five">
            </div>

            <div class="sixth">
                <img src="svg/zoom.svg" class="six">
            </div>

        </div>



    </div>



</body>

</html>
